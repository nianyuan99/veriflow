[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyflow-server"
version = "0.1.0"
description = "VerifyFlow Backend — AI Code Review Agent + Sandbox Verify + Obsidian Sync"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "sqlalchemy>=2.0.25",
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "openai>=1.6.0",
    "anthropic>=0.18.0",
    "docker>=6.1.0",
    "tree-sitter>=0.21.0",
    "semgrep>=1.50.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "alembic>=1.13.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
