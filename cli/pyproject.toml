[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyflow-cli"
version = "0.1.0"
description = "VerifyFlow CLI — AI Code Review from the command line"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
